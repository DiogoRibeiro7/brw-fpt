[tool.poetry]
name = "brwfpt"
version = "0.1.0"
description = "Large deviations and spine importance sampling for first-passage times in branching random walks"
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pytest>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/diogoribeiro7/brw-fpt"
repository = "https://github.com/diogoribeiro7/brw-fpt"
keywords = ["branching-random-walk", "large-deviations", "rare-events", "importance-sampling", "probability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics"
]
packages = [{ include = "brwfpt", from = "src" }]


[tool.poetry.dependencies]
python = ">=3.9,<3.14"
numpy = "^2.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0"


[tool.poetry.scripts]
# Optional: console entry points later
# brwfpt-demo = "brwfpt.cli:main"


[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
